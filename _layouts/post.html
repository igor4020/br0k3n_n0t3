---
layout: default
---
<a class="back" href="{{ '/' | relative_url }}">back</a>
<article class="post">
  <h1>{{ page.title }}</h1>
  <div class="meta">
    <span>{{ page.date | date: "%B %-d, %Y" }}</span>
    {%- if page.read_time -%}<span class="dot">·</span><span>~ {{ page.read_time }} min read</span>{%- endif -%}
    {%- if page.tags and page.tags.size > 0 -%}
      <span class="dot">·</span>
      <span>{{ page.tags | join: " / " }}</span>
    {%- endif -%}
  </div>

  {{ content }}
</article>
